<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>דוח שעות</title>
  <style>
    /* --------------------------------------------------
       1. עיצוב כללי לתצוגה במסך (Screen Style)
       -------------------------------------------------- */
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      direction: rtl;
      background-color: #f9f9f9;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .export-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .export-btn:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: right;
    }

    th {
      background-color: #f2f2f2;
    }

    /* עיצוב כפתורי העריכה/עפרונות */
    .edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    /* --------------------------------------------------
       2. כללים לייצוא ל-PDF / הדפסה (Print Style)
       -------------------------------------------------- */
    @media print {
      /* הסתרת כל האלמנטים שלא אמורים להופיע ב-PDF */
      .no-print,
      .edit-btn,
      .pencil-icon,
      .export-btn {
        display: none !important;
      }

      /* התאמת הדף למראה נקי ב-PDF */
      body {
        background: #ffffff;
        margin: 0;
        padding: 0;
      }

      .container {
        box-shadow: none;
        padding: 0;
        width: 100%;
        max-width: 100%;
      }

      table {
        border: 1px solid #000;
      }

      th, td {
        border: 1px solid #000;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- כפתור לייצוא/הדפסה -->
    <button class="export-btn no-print" onclick="window.print()">שמור כ-PDF / הדפס</button>

    <h2>דוח שעות עבודה</h2>

    <table>
      <thead>
        <tr>
          <th>תאריך</th>
          <th>שעת כניסה</th>
          <th>שעת יציאה</th>
          <th>סה"כ שעות</th>
          <th class="no-print">עריכה</th> <!-- עמודה שתוסתר ב-PDF -->
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>01/08/2026</td>
          <td>08:00</td>
          <td>17:00</td>
          <td>09:00</td>
          <td class="no-print">
            <button class="edit-btn" title="ערוך">✏️</button>
          </td>
        </tr>
        <tr>
          <td>02/08/2026</td>
          <td>08:30</td>
          <td>16:30</td>
          <td>08:00</td>
          <td class="no-print">
            <button class="edit-btn" title="ערוך">✏️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
