<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הגשת משמרות</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .week-range {
            font-weight: bold;
            background: #eff6ff;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bfdbfe;
        }

        .day-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        .day-info {
            flex: 1;
        }

        .day-name {
            font-weight: 600;
        }

        .day-date {
            font-size: 0.85rem;
            color: #64748b;
        }

        .shift-options {
            display: flex;
            gap: 8px;
        }

        .shift-options label {
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .shift-options input[type="checkbox"]:checked + span {
            font-weight: bold;
            color: var(--primary-color);
        }

        .submit-btn {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>הגשת משמרות לשבוע הבא</h1>
    <div class="week-range" id="weekRangeDisplay">טוען תאריכים...</div>

    <form id="shiftForm">
        <div id="daysContainer"></div>
        <button type="submit" class="submit-btn">שמור הגשה</button>
    </form>
</div>

<script>
    /**
     * מחשב את תאריכי שבוע המשמרות הבא.
     * מיום חמישי והלאה, המערכת מציגה אוטומטית את ימים ראשון-שבת של השבוע העוקב.
     */
    function calculateNextWeekDates() {
        const today = new Date();
        const currentDay = today.getDay(); // 0 = ראשון, 4 = חמישי, 6 = שבת

        // מחישוב יום חמישי (4) והלאה -> קופצים ליום ראשון הקרוב של שבוע הבא
        let daysUntilNextSunday;
        if (currentDay >= 4) {
            daysUntilNextSunday = 7 - currentDay; // חמישי (+3), שישי (+2), שבת (+1)
        } else {
            // בין ראשון לרביעי -> מציג את השבוע שמתחיל ביום ראשון הקרוב
            daysUntilNextSunday = (7 - currentDay) % 7;
            if (daysUntilNextSunday === 0) daysUntilNextSunday = 7;
        }

        const nextSunday = new Date(today);
        nextSunday.setDate(today.getDate() + daysUntilNextSunday);

        const dayNames = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        const weekDates = [];

        for (let i = 0; i < 7; i++) {
            const date = new Date(nextSunday);
            date.setDate(nextSunday.getDate() + i);

            weekDates.push({
                dayName: dayNames[i],
                formattedDate: date.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' }),
                isoDate: date.toISOString().split('T')[0]
            });
        }

        return weekDates;
    }

    function renderShiftForm() {
        const weekDates = calculateNextWeekDates();
        const container = document.getElementById('daysContainer');
        const rangeDisplay = document.getElementById('weekRangeDisplay');

        // עדכון כותרת טווח התאריכים
        const start = weekDates[0].formattedDate;
        const end = weekDates[6].formattedDate;
        rangeDisplay.textContent = `תאריכי שבוע ההגשה: ${start} - ${end}`;

        container.innerHTML = '';

        weekDates.forEach((dayData, index) => {
            const row = document.createElement('div');
            row.className = 'day-row';
            row.innerHTML = `
                <div class="day-info">
                    <div class="day-name">יום ${dayData.dayName}</div>
                    <div class="day-date">${dayData.formattedDate}</div>
                </div>
                <div class="shift-options">
                    <label>
                        <input type="checkbox" name="shift_${dayData.isoDate}" value="בוקר">
                        <span>בוקר</span>
                    </label>
                    <label>
                        <input type="checkbox" name="shift_${dayData.isoDate}" value="ערב">
                        <span>ערב</span>
                    </label>
                    <label>
                        <input type="checkbox" name="shift_${dayData.isoDate}" value="לילה">
                        <span>לילה</span>
                    </label>
                </div>
            `;
            container.appendChild(row);
        });
    }

    // טיפול בשליחת הטופס
    document.getElementById('shiftForm').addEventListener('submit', function (e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const submissions = {};

        for (let [key, value] of formData.entries()) {
            if (!submissions[key]) {
                submissions[key] = [];
            }
            submissions[key].push(value);
        }

        console.log('נתוני הגשה לשמירה:', submissions);
        alert('המשמרות נשמרו בהצלחה!');
    });

    // הרצה בטעינת העמוד
    renderShiftForm();
</script>

</body>
</html>
