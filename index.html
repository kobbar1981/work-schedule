<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול נתוני מסעדות</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; direction: rtl; text-align: right; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        select, input, button { padding: 10px; margin: 8px 0; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .box { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 4px; margin-top: 15px; }
        .disabled-section { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ניהול נתוני מסעדות</h2>
    
    <label for="restaurantSelect"><strong>בחר מסעדה פעילה:</strong></label>
    <select id="restaurantSelect" onchange="changeRestaurant()">
        <option value="" disabled selected>-- בחר מסעדה מהרשימה --</option>
        <option value="yoko">יוקו</option>
        <option value="symphony">סימפוניה</option>
        <option value="zen">זן</option>
    </select>

    <h3 id="currentRestaurantTitle" style="color: #333;">אנא בחר מסעדה כדי להתחיל</h3>

    <!-- אזור הנתונים שמוצג רק לאחר בחירת מסעדה -->
    <div id="appContent" class="disabled-section">
        <div class="box">
            <label for="dataInput"><strong>הכנס נתונים למסעדה זו:</strong></label>
            <input type="text" id="dataInput" placeholder="הקלד מידע או נתונים כאן...">
            <button onclick="saveData()">שמור נתונים</button>
        </div>

        <div class="box">
            <h4>נתונים שמורים למסעדה הנוכחית:</h4>
            <p id="displayData" style="color: #555; font-weight: bold;"></p>
        </div>
    </div>
</div>

<script>
    function initApp() {
        let currentRest = localStorage.getItem('selectedRestaurant');
        
        if (currentRest) {
            // אם המשתמש כבר בחר מסעדה בעבר, נטען אותה אוטומטית
            document.getElementById('restaurantSelect').value = currentRest;
            updateUI();
        } else {
            // בכניסה ראשונה - אין בחירה, האזור נשאר נעול
            document.getElementById('appContent').classList.add('disabled-section');
        }
    }

    function changeRestaurant() {
        const selectElement = document.getElementById('restaurantSelect');
        const selectedRest = selectElement.value;
        
        if (!selectedRest) return;

        // שמירת הבחירה החדשה
        localStorage.setItem('selectedRestaurant', selectedRest);
        updateUI();
    }

    function updateUI() {
        const currentRest = localStorage.getItem('selectedRestaurant');
        const selectElement = document.getElementById('restaurantSelect');
        const appContent = document.getElementById('appContent');
        
        if (!currentRest) {
            appContent.classList.add('disabled-section');
            document.getElementById('currentRestaurantTitle').innerText = 'אנא בחר מסעדה כדי להתחיל';
            return;
        }

        // הסרת חסימה מאזור העבודה
        appContent.classList.remove('disabled-section');

        // עדכון כותרת המסעדה
        const selectedOptionText = selectElement.options[selectElement.selectedIndex].text;
        document.getElementById('currentRestaurantTitle').innerText = `מסעדה פעילה: ${selectedOptionText}`;

        // שליפת הנתונים הספציפיים אך ורק למסעדה הנוכחית
        const restaurantData = localStorage.getItem('data_' + currentRest) || 'אין נתונים שמורים עדיין למסעדה זו';
        document.getElementById('displayData').innerText = restaurantData;
        document.getElementById('dataInput').value = '';
    }

    function saveData() {
        const currentRest = localStorage.getItem('selectedRestaurant');
        if (!currentRest) return;

        const inputVal = document.getElementById('dataInput').value;
        
        if (!inputVal.trim()) {
            alert('נא להזין טקסט בשדה לפני השמירה');
            return;
        }

        // שמירת הנתונים במפתח ייחודי למסעדה הנבחרת (למשל: data_yoko, data_zen)
        localStorage.setItem('data_' + currentRest, inputVal);
        updateUI();
        alert('הנתונים נשמרו בהצלחה!');
    }

    // הפעלה בעליית העמוד
    window.onload = initApp;
</script>

</body>
</html>
